<!DOCTYPE html>

  <title>Company Profile Web Details</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .gallery-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }

    .gallery-item {
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    .gallery-item img {
      width: 100%;
      height: auto;
      display: block;
    }

    .gallery-item .description {
      padding: 10px;
      text-align: center;
    }

    /* Center the last remaining image */
    .gallery-container:only-child {
      display: flex;
      justify-content: center;
    }

    /* Make sure the gallery-item size remains consistent */
    .gallery-container:only-child .gallery-item {
      width: 100%; /* The image size will stay the same */
    }
  </style>
</head>
